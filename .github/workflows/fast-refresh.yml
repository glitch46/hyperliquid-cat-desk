name: Refresh public markets and crypto liquidations

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-public-market-data
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source accounting
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Refresh public data without fill scans or broker credentials
        id: collect
        continue-on-error: true
        run: python -u scripts/fast_refresh.py --wallet-limit 60 --budget 180
      - name: Publish the latest timestamped public observations
        run: |
          git add data/fast.json
          if [ -f data/liquidations.json ]; then git add data/liquidations.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh public markets and crypto liquidation watch'
          for attempt in 1 2 3; do
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Surface retained-source failures
        if: steps.collect.outcome == 'failure'
        run: exit 1
