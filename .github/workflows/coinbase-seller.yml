name: Refresh Coinbase seller investigation

on:
  schedule:
    - cron: '34 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coinbase-seller-data
  cancel-in-progress: false

jobs:
  seller:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify accounting and attribution boundaries
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Collect public Bitcoin, company, and Coinbase evidence
        id: collect
        continue-on-error: true
        run: python -u scripts/coinbase_seller.py --max-requests 80
      - name: Publish dated observations
        run: |
          git add data/coinbase_seller.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh Coinbase seller investigation'
          for attempt in 1 2 3; do
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Surface source failures
        if: steps.collect.outcome == 'failure'
        run: exit 1
